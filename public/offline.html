<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexion - Domio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background-color: #f9fafb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      color: #2563EB;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.95rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    button {
      background-color: #2563EB;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    button:active {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.83M8.363 8.365A8 8 0 0119.07 19.07M5.636 5.637a8 8 0 000 11.314M12 2a10 10 0 110 20A10 10 0 0112 2z"/>
    </svg>
    <h1>Sin conexion a internet</h1>
    <p>Comprueba tu conexion e intentalo de nuevo. Tus datos siguen guardados en la nube.</p>
    <button onclick="window.location.reload()">Volver a intentar</button>
  </div>
</body>
</html>
