<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <title>Sin conexión - Domio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background-color: #f9fafb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .container {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      color: #2563EB;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.95rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    button {
      background-color: #2563EB;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 12.86a10 10 0 0 1 5.17-2.69M8.5 16.43a5 5 0 0 1 7 0M12 20h.01M2 2l20 20"/>
    </svg>
    <h1>Sin conexión a internet</h1>
    <p>Comprueba tu conexión e inténtalo de nuevo. Tus datos siguen guardados en la nube.</p>
    <button onclick="window.location.reload()">Volver a intentar</button>
  </div>
</body>
</html>
