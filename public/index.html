<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA theme color -->
    <meta name="theme-color" content="#2563EB" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Apple Touch Icon (iOS homescreen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="description" content="Gestiona tus propiedades en alquiler de forma sencilla y segura." />

    <!-- Disable iOS call / address detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS standalone mode. "default" keeps the content below the status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Domio" />

    <title>Domio</title>
  </head>
  <body>
    <noscript>Necesitas JavaScript para usar Domio.</noscript>
    <div id="root"></div>
    <!-- The service worker is registered from src/serviceWorkerRegistration.js -->
  </body>
</html>
